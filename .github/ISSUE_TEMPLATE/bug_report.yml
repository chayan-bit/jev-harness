name: Bug report
description: Something in jev-harness does not work as documented.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Do not include API keys, private data, or live payloads, and report security problems privately through the Security tab instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest offline script or steps that show the problem. The bundled OfflineChoiceProvider is ideal.
      render: python
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Actual output or traceback
      render: text
  - type: input
    id: version
    attributes:
      label: jev-harness version or commit
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: CPython 3.11 on Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Advisory (analyze_snapshot)
        - Codex hooks or the CLI
        - Shadow judgments (Decisions)
        - Ports or adapters
        - Calibration
        - Providers
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed API keys and private data from this report.
          required: true
