name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Pull requests opened with GITHUB_TOKEN do not trigger CI, but workflow_dispatch does.
      # The dispatched run's checks attach to the release branch head SHA, which satisfies the required checks.
      - name: Run CI on the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          jq -r '.[].headBranchName' <<<"$PRS" | while read -r branch; do
            echo "Dispatching CI on $branch"
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          done
