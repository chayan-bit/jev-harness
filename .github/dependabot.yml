version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: ["dependencies", "github-actions"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels: ["dependencies", "python"]
    groups:
      python-dependencies:
        patterns: ["*"]
