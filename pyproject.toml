[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-harness"
version = "0.1.1"
description = "Attachable Jev elements for any agent harness: bounded advisory, source-bound shadow judgments and threshold calibration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chayan Aggarwal" }]
keywords = ["jev", "typesafe", "agents", "harness", "codex", "hooks", "calibration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "jev-frame @ git+https://github.com/chayan-bit/Jev-Frame@v0.1.0",
  "pydantic>=2.13,<3",
]

[project.scripts]
jev-harness = "jev_harness.cli:main"

[project.urls]
Homepage = "https://github.com/chayan-bit/jev-harness"
Repository = "https://github.com/chayan-bit/jev-harness"
Issues = "https://github.com/chayan-bit/jev-harness/issues"
Documentation = "https://github.com/chayan-bit/jev-harness/tree/main/docs"
Changelog = "https://github.com/chayan-bit/jev-harness/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev_harness = ["py.typed"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
