# git-cliff configuration: https://git-cliff.org/docs/configuration
#
# Generates CHANGELOG.md from Conventional Commits.
# Section names follow Keep a Changelog, and the entry layout matches release-please
# (see release-please-config.json), so both tools can maintain the same file.
# Regenerate the released history with: git cliff --latest -o CHANGELOG.md

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
Entries are generated from [Conventional Commits](https://www.conventionalcommits.org/) by git-cliff and release-please, so do not edit this file by hand.
"""
body = """
{%- set repo_url = "https://github.com/chayan-bit/jev-harness" -%}
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}]({{ repo_url }}/{% if previous.version %}compare/{{ previous.version }}...{{ version }}{% else %}releases/tag/{{ version }}{% endif %}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}
## Unreleased
{% endif %}
{%- for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim }}

{% for commit in commits -%}
* {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }} ([{{ commit.id | truncate(length=7, end="") }}]({{ repo_url }}/commit/{{ commit.id }}))
{% endfor -%}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_preprocessors = [
  { pattern = '#(\d+)', replace = "[#${1}](https://github.com/chayan-bit/jev-harness/issues/${1})" },
]
# Keep these groups and their order in sync with changelog-sections in release-please-config.json.
commit_parsers = [
  { message = "^Merge", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^revert", group = "<!-- 4 -->Reverted" },
  { message = "^deps", group = "<!-- 5 -->Dependencies" },
  { message = "^(docs|chore|test|ci|style|build)", skip = true },
]
